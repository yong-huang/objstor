version: '3.8'

services:
  objstor:
    image: objstor:latest
    container_name: objstor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount storage directory for pools (mapped to host directory)
      - /Users/hyhit/Desktop/workspace/storage:/app/storage
      # Mount data directory for metadata and config
      - ./data:/app/data
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - RUST_LOG=info
      - OBJSTOR_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - objstor_network

  # Optional: Add monitoring with Prometheus
