version: '3.8'

services:
  objstor:
    image: objstor:latest
    container_name: objstor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - objstor_data:/app/data
      - objstor_logs:/app/logs
    environment:
      - RUST_LOG=info
    networks:
      - objstor_network
    labels:
      - "prometheus.io.scrape=true"
      - "prometheus.io.port=8080"
      - "prometheus.io.path=/api/v1/metrics"

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: objstor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./examples/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - objstor_network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: objstor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./examples/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./examples/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    networks:
      - objstor_network

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: objstor-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./examples/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - objstor_network

volumes:
  objstor_data:
    driver: local
  objstor_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  objstor_network:
    driver: bridge
