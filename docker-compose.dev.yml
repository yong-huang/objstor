version: '3.8'

services:
  objstor-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: objstor-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount source code for development
      - ./src:/app/src:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./Cargo.lock:/app/Cargo.lock:ro
      # Mount data directory
      - objstor_dev_data:/app/data
      # Mount logs
      - objstor_dev_logs:/app/logs
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - OBJSTOR_DATA_DIR=/app/data
    command: /app/objstor
    networks:
      - objstor_network

volumes:
  objstor_dev_data:
    driver: local
  objstor_dev_logs:
    driver: local

networks:
  objstor_network:
    driver: bridge
